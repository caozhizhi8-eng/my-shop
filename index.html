<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嚴選好物 ｜ 質感生活推薦</title>
    <style>
        :root {
            --primary-color: #ee4d2d;
            --primary-dark: #d73211;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-secondary: #757575;
            --border-color: #e5e5e5;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.06);
            --transition: all 0.25s ease;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 頂部導覽列 */
        header {
            background: linear-gradient(135deg, #f53d2d, #ff6633);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* 主要內容容器 */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        /* 商品網格佈局 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* 商品卡片 */
        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .product-image-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fafafa;
            overflow: hidden;
            position: relative;
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .product-image-wrap img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-name {
            font-size: 0.90rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8em;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-tag {
            font-size: 0.75rem;
            color: var(--primary-color);
            background-color: rgba(238, 77, 45, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .btn-view {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-view:hover {
            background-color: var(--primary-dark);
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
            background-color: #ffffff;
        }

        /* 響應式微調 */
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px
