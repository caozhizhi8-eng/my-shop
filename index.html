.slide .price{font-size:30px;margin-top:auto}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .2s}
.dots i.on{width:18px;border-radius:3px;background:#fff}

.section-title span{margin-left:auto;font-size:13px;font-weight:400;color:var(--mute)}

.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.product-card{background:var(--card);border-radius:10px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.product-info{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.product-name{font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.price{font-weight:800;font-size:20px;color:var(--c);margin-top:auto;padding-top:2px}
.btn{display:block;text-align:center;text-decoration:none;background:var(--c);color:#fff;font-weight:700;font-size:14px;padding:9px;border-radius:6px;margin-top:4px;transition:background .2s}
.slide .btn{padding:13px;font-size:16px}
.btn:hover{background:var(--cd)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--mute);font-size:14px}
footer{text-align:center;padding:32px 16px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);margin-top:48px;background:var(--card)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@media(max-width:759px){

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cands=(p,i)=>{const b=p.img||(i+'.jpg'),c=[b];
  if(/^sg-/.test(b))c.push(b.replace(/^sg-/,'SG-'));
  if(/^SG-/.test(b))c.push(b.replace(/^SG-/,'sg-'));
  const m=b.match(/^(\d+)_jpg\.webp$/);if(m)c.push(m[1]+'.jpg.webp');
  c.push(i+'.jpg');return [...new Set(c)];};
function nx(el){const c=JSON.parse(el.dataset.c);const k=+el.dataset.k+1;if(k<c.length){el.dataset.k=k;el.src=c[k];}else el.remove();}
const img=(p,i)=>{const c=cands(p,i);return `<div class="img"><img src="${esc(c[0])}" data-c='${esc(JSON.stringify(c))}' data-k="0" alt="${esc(p.name)}" loading="lazy" onerror="nx(this)"></div>`;};
const buy=(p,t)=>`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">${t}</a>`;

document.getElementById('slides').innerHTML=products.slice(0,HERO_COUNT).map((p,k)=>`
  <article class="slide">
    ${img(p,k+1)}
    <div class="info">
      <span class="rank">主打推薦 No.${k+1}</span>
      <h2 class="name">${esc(p.name)}</h2>
      <div class="price">${esc(p.price)}</div>
      ${buy(p,'前往蝦皮下單')}
    </div>
  </article>`).join('');
document.getElementById('dots').innerHTML=products.slice(0,HERO_COUNT).map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('');
document.getElementById('slides').addEventListener('scroll',e=>{
  const s=e.target,i=Math.round(s.scrollLeft/(s.firstElementChild.offsetWidth+12));
  [...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
},{passive:true});

const CATS=['美妝保養','保健食品','食品','日用品','泡麵'];
let curCat='全部';
const catCount=c=>c==='全部'?products.length:products.filter(p=>p.cat===c).length;
function renderChips(){
  document.getElementById('chips').innerHTML=['全部',...CATS].filter(c=>c==='全部'||catCount(c)>0).map(c=>`<button type="button" class="chip${c===curCat?' on':''}" data-c="${esc(c)}" aria-pressed="${c===curCat}">${esc(c)} ${catCount(c)}</button>`).join('');
}
function renderGrid(){
  const list=products.map((p,i)=>({p,i})).filter(o=>curCat==='全部'||o.p.cat===curCat);
  document.getElementById('count').textContent=`共 ${list.length} 件`;
  document.getElementById('product-grid').innerHTML=list.length?list.map(({p,i})=>`
  <article class="product-card">
    ${img(p,i+1)}
    <div class="product-info">
      <h3 class="product-name">${esc(p.name)}</h3>
      <div class="price">${esc(p.price)}</div>
      ${buy(p,'立即搶購')}
    </div>
  </article>`).join(''):'<div class="empty">這個分類還沒有商品</div>';
}
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  curCat=b.dataset.c;renderChips();renderGrid();
});
renderChips();renderGrid();
