<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嚴選好物 ｜ 蝦皮精選推薦</title>
<style>
:root{--c:#ee4d2d;--c2:#ff7337;--cd:#d73211;--bg:#f5f5f5;--card:#fff;--ink:#222;--mute:#757575;--line:#e8e8e8;--soft:#fff1ed;--sh:0 2px 10px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--c:#ff6a45;--c2:#ff8a4d;--cd:#ff8260;--bg:#121212;--card:#1e1e1e;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2d2d2d;--soft:#3a211b;--sh:0 2px 10px rgba(0,0,0,.4)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.container{max-width:1200px;margin:0 auto;padding:0 12px}

/* 封面：主打商品 */
.cover{background:linear-gradient(120deg,var(--c),var(--c2));padding:12px 0 14px}
.cover .tt{color:#fff;font-weight:800;font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.cover .tt span{font-size:12px;font-weight:400;opacity:.9}
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:var(--card);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);overflow:hidden;display:grid;grid-template-columns:1fr}
@media(min-width:760px){.slide{grid-template-columns:1fr 1fr;flex-basis:760px}}
.img{position:relative;overflow:hidden;aspect-ratio:1/1;background:var(--soft)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.slide .info{padding:16px;display:flex;flex-direction:column;gap:8px}
.rank{align-self:flex-start;background:var(--c);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:4px}
.slide .name{font-size:16px;font-weight:700;line-height:1.5}
.slide .price{font-size:30px;margin-top:auto}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .2s}
.dots i.on{width:18px;border-radius:3px;background:#fff}

.section-title{font-size:18px;font-weight:800;margin:24px 0 14px;border-left:4px solid var(--c);padding-left:10px;display:flex;align-items:center}
.section-title span{margin-left:auto;font-size:13px;font-weight:400;color:var(--mute)}

.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.product-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}}
.product-card{background:var(--card);border-radius:10px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.product-info{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.product-name{font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.price{font-weight:800;font-size:20px;color:var(--c);margin-top:auto;padding-top:2px}
.btn{display:block;text-align:center;text-decoration:none;background:var(--c);color:#fff;font-weight:700;font-size:14px;padding:9px;border-radius:6px;margin-top:4px;transition:background .2s}
.slide .btn{padding:13px;font-size:16px}
.btn:hover{background:var(--cd)}

footer{text-align:center;padding:32px 16px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);margin-top:48px;background:var(--card)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* 封面縮小：手機改成左圖右文 */
@media(max-width:759px){
.slide{flex-basis:92%;grid-template-columns:130px 1fr;border-radius:12px}
.slide .img{aspect-ratio:1/1;height:100%}
.slide .info{padding:10px 12px;gap:4px}
.slide .name{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slide .price{font-size:22px;margin-top:2px}
.slide .btn{padding:8px;font-size:14px;margin-top:auto}
.rank{font-size:11px}
}
</style>

  [...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
