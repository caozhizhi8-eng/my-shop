const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cands=(p,i)=>{const b=p.img||(i+'.jpg'),c=[b];
  if(/^sg-/.test(b))c.push(b.replace(/^sg-/,'SG-'));
  if(/^SG-/.test(b))c.push(b.replace(/^SG-/,'sg-'));
  const m=b.match(/^(\d+)_jpg\.webp$/);if(m)c.push(m[1]+'.jpg.webp');
  c.push(i+'.jpg');return [...new Set(c)];};
function nx(el){const c=JSON.parse(el.dataset.c);const k=+el.dataset.k+1;if(k<c.length){el.dataset.k=k;el.src=c[k];}else el.remove();}
const img=(p,i)=>{const c=cands(p,i);return `<div class="img"><img src="${esc(c[0])}" data-c='${esc(JSON.stringify(c))}' data-k="0" alt="${esc(p.name)}" loading="lazy" onerror="nx(this)"></div>`;};
const buy=(p,t)=>`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">${t}</a>`;

document.getElementById('slides').innerHTML=products.slice(0,HERO_COUNT).map((p,k)=>`
  <article class="slide">
    ${img(p,k+1)}
    <div class="info">
      <span class="rank">主打推薦 No.${k+1}</span>
      <h2 class="name">${esc(p.name)}</h2>
      <div class="price">${esc(p.price)}</div>
      ${buy(p,'前往蝦皮下單')}
    </div>
  </article>`).join('');
document.getElementById('dots').innerHTML=products.slice(0,HERO_COUNT).map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('');
document.getElementById('slides').addEventListener('scroll',e=>{
  const s=e.target,i=Math.round(s.scrollLeft/(s.firstElementChild.offsetWidth+12));
  [...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
},{passive:true});

document.getElementById('count').textContent=`共 ${products.length} 件`;
document.getElementById('product-grid').innerHTML=products.map((p,k)=>`
  <article class="product-card">
    ${img(p,k+1)}
    <div class="product-info">
      <h3 class="product-name">${esc(p.name)}</h3>
      <div class="price">${esc(p.price)}</div>
      ${buy(p,'立即搶購')}
    </div>
  </article>`).join('');
