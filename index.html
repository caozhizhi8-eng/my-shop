.slide .btn{padding:13px;font-size:16px}

.catbox{position:relative;display:inline-block;margin:0 0 12px}

.catbtn i{font-style:normal;color:var(--c);transition:transform .2s}
.catbtn[aria-expanded="true"] i{transform:rotate(180deg)}
.catlist{position:absolute;left:0;top:calc(100% + 6px);z-index:20;min-width:100%;width:max-content;max-height:min(60vh,420px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px}

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cands=(p,i)=>{const b=p.img||(i+'.jpg'),c=[b];
  if(/^sg-/.test(b))c.push(b.replace(/^sg-/,'SG-'));
  if(/^SG-/.test(b))c.push(b.replace(/^SG-/,'sg-'));
  const m=b.match(/^(\d+)_jpg\.webp$/);if(m)c.push(m[1]+'.jpg.webp');
  c.push(i+'.jpg');return [...new Set(c)];};
function nx(el){const c=JSON.parse(el.dataset.c);const k=+el.dataset.k+1;if(k<c.length){el.dataset.k=k;el.src=c[k];}else el.remove();}
const img=(p,i)=>{const c=cands(p,i);return `<div class="img"><img src="${esc(c[0])}" data-c='${esc(JSON.stringify(c))}' data-k="0" alt="${esc(p.name)}" loading="lazy" onerror="nx(this)"></div>`;};
const buy=(p,t)=>`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">${t}</a>`;

document.getElementById('slides').innerHTML=products.slice(0,HERO_COUNT).map((p,k)=>`
  <article class="slide">
    ${img(p,k+1)}
    <div class="info">
      <span class="rank">主打推薦 No.${k+1}</span>
      <h2 class="name">${esc(p.name)}</h2>
      <div class="price">${esc(p.price)}</div>
      ${buy(p,'前往蝦皮下單')}
    </div>
  </article>`).join('');
document.getElementById('dots').innerHTML=products.slice(0,HERO_COUNT).map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('');
document.getElementById('slides').addEventListener('scroll',e=>{
  const s=e.target,i=Math.round(s.scrollLeft/(s.firstElementChild.offsetWidth+12));
  [...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
},{passive:true});

const CATS=['面膜','生理用品','濕紙巾','M2保養','保健食品','美妝保養','泡麵麵食','零食飲品','居家清潔','生活雜貨','寵物用品','3C家電','母嬰'];
let curCat='全部';
const catCount=c=>c==='全部'?products.length:products.filter(p=>p.cat===c).length;
function renderChips(){
  document.getElementById('catlabel').textContent=curCat+' '+catCount(curCat);
  document.getElementById('catlist').innerHTML=['全部',...CATS].filter(c=>c==='全部'||catCount(c)>0).map(c=>`<button type="button" class="catopt${c===curCat?' on':''}" role="option" aria-selected="${c===curCat}" data-c="${esc(c)}">${esc(c)}<span>${catCount(c)}</span></button>`).join('');
}
function renderGrid(){
  const list=products.map((p,i)=>({p,i})).filter(o=>curCat==='全部'||o.p.cat===curCat);
  document.getElementById('count').textContent=`共 ${list.length} 件`;
  document.getElementById('product-grid').innerHTML=list.length?list.map(({p,i})=>`
  <article class="product-card">
    ${img(p,i+1)}
    <div class="product-info">
      <h3 class="product-name">${esc(p.name)}</h3>
      <div class="price">${esc(p.price)}</div>
      ${buy(p,'立即搶購')}
    </div>
  </article>`).join(''):'<div class="empty">這個分類還沒有商品</div>';
}
function setOpen(o){document.getElementById('catbtn').setAttribute('aria-expanded',o);document.getElementById('catlist').hidden=!o;}
document.getElementById('catbtn').addEventListener('click',()=>setOpen(document.getElementById('catlist').hidden));
document.getElementById('catlist').addEventListener('click',e=>{
  const b=e.target.closest('.catopt');if(!b)return;
  curCat=b.dataset.c;renderChips();renderGrid();setOpen(false);
});
document.addEventListener('click',e=>{if(!e.target.closest('#catbox'))setOpen(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false);});
renderChips();renderGrid();
</script>
